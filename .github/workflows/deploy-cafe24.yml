# =============================================================
# GitHub → 카페24 자동배포 (FTP)
#  - main 브랜치에 push하면 카페24 웹 루트로 파일이 올라갑니다.
#  - config.php 등 민감/불필요 파일은 업로드에서 제외합니다.
#  - FTP 접속정보는 코드가 아니라 GitHub Secrets에 저장합니다:
#      저장소 > Settings > Secrets and variables > Actions 에서
#      CAFE24_FTP_HOST / CAFE24_FTP_USER / CAFE24_FTP_PASSWORD 등록
#  - server-dir(웹 루트)은 카페24 "파일관리"에서 실제 경로 확인 후 맞추세요.
#    (보통 /www/ 또는 /public_html/)
# =============================================================
name: Deploy to Cafe24

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.CAFE24_FTP_HOST }}
          username: ${{ secrets.CAFE24_FTP_USER }}
          password: ${{ secrets.CAFE24_FTP_PASSWORD }}
          protocol: ftps          # 카페24가 FTPS를 지원하지 않으면 ftp 로 변경
          port: 21
          server-dir: /www/       # ← 카페24 웹 루트에 맞게 수정
          # 아래 항목은 절대 업로드하지 않음 (config.php 보호 + 불필요 파일 제외)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config.php
            config.cafe24.php
            config.infinityfree.php
            *.sql
            *.md
